<style>
  :root{--bg:#fafafa;--card:#fff;--line:#dbdbdb;--ink:#111;--mut:#737373;--acc:#d62828;--blue:#0095f6}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .app{max-width:470px;margin:0 auto;background:var(--card);min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  /* meses */
  .months{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 12px 8px}
  .months .yr{font-size:11px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin:0 2px 6px;display:flex;justify-content:space-between}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:#262626;background:#fff;position:relative}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.has::after{content:"";position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
  .chip.lock{color:#a8a8a8}
  /* topo do perfil */
  .bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
  .bar h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px}
  .prof{display:flex;align-items:center;gap:24px;padding:10px 16px 6px}
  .avatar{width:84px;height:84px;border-radius:50%;padding:3px;background:conic-gradient(#f9ce34,#ee2a7b,#6228d7,#f9ce34);flex:0 0 auto}
  .avatar>div{width:100%;height:100%;border-radius:50%;border:3px solid #fff;background:#111;color:#fff;display:grid;place-items:center;font:700 30px Poppins,sans-serif}
  .stats{flex:1;display:flex;justify-content:space-around;text-align:center}
  .stats b{display:block;font-size:17px}
  .stats span{font-size:13px;color:#262626}
  .bio{padding:4px 16px 10px;font-size:14px;line-height:1.35}
  .bio b{display:block}
  .note{margin:0 16px 10px;padding:8px 10px;border-radius:8px;background:#fff7e6;border:1px solid #f3d7a0;font-size:12px;color:#7a5200;line-height:1.4}

  .hl .ring>div{width:100%;height:100%;border-radius:50%;border:2px solid #fff;background:#222;color:#fff;display:grid;place-items:center;font:600 13px Inter}
  .hl .empty{font-size:12px;color:var(--mut);padding:4px 0}
  /* abas */
  .tabs{display:flex;border-top:1px solid var(--line)}
  .tabs button{flex:1;padding:11px 0;display:flex;justify-content:center;border-top:1px solid transparent;margin-top:-1px;color:var(--mut)}
  .tabs button.on{border-top-color:var(--ink);color:var(--ink)}
  .tabs svg{width:22px;height:22px}

  .tile{position:relative;aspect-ratio:3/4;overflow:hidden;background:#111}

  .locked h3{color:var(--ink);font-size:16px;margin-bottom:6px}
  .locked p{font-size:14px;line-height:1.45}

  .ov.open{display:flex}
  .post{background:#fff;width:100%;max-width:440px;max-height:96vh;overflow:auto;border-radius:12px}
  .ph-head{display:flex;align-items:center;gap:10px;padding:10px 12px}

  .x{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
  .x:hover{background:#f2f2f2}
  .stage{position:relative;background:#000;aspect-ratio:4/5;overflow:hidden}
  .stage.v{aspect-ratio:9/16;max-height:72vh;margin:0 auto}
  .track{display:flex;height:100%;transition:transform .3s ease}
  .slide{flex:0 0 100%;height:100%}
  .slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block}
  .slide .ph{padding:28px}
  .slide .ph .t{font-size:17px;-webkit-line-clamp:unset;white-space:pre-line;line-height:1.4}
  .slide .ph .k{font-size:10px;margin-top:14px}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .nav.l{left:8px}.nav.r{right:8px}
  .count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px}
  .dots{display:flex;justify-content:center;gap:4px;padding:10px 0 2px}
  .dots i{width:6px;height:6px;border-radius:50%;background:#c7c7c7}
  .dots i.on{background:var(--blue)}
  .acts{display:flex;gap:14px;padding:6px 12px}
  .acts svg{width:24px;height:24px}
  .meta{padding:2px 12px 0;display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:#f2f2f2;color:#262626}
  .tag.warn{background:#fff3e0;color:#9a5b00}
  .cap{padding:8px 12px 16px;font-size:14px;line-height:1.45;white-space:pre-line}
  .cap b{font-weight:600;margin-right:4px}
  .foot{padding:18px 16px 28px;text-align:center;font-size:11px;color:#a8a8a8}
</style>
</head>

  r:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-4.4-9.3-9A5.4 5.4 0 0 1 12 6a5.4 5.4 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z"/></svg>',
  com:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.4A8.5 8.5 0 1 1 21 12z"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 3L9.2 10.1M22 3l-6.5 18-3.3-7.9L4 9.8z"/></svg>'
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KIND = {carrossel:"Carrossel", reels:"Reels", dump:"Photo dump", estatico:"Post estático", unico:"Post único"};

function monthState(m){
  const has = DATA.months[String(m)];
  if (has) return "open";
  // planejamento do mês m é enviado no dia 20 do mês anterior
  const release = new Date(DATA.year, m-2, 20, 0, 0, 0);
  if (today >= release) return "past";
  return "future";
}
function fmtDate(p){
  if (!p.date) return null;
  const d = new Date(p.date+"T12:00:00");
  return DIAS[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
}
function feedOrder(posts){
  // feed real: mais recente primeiro. Sem data, respeita a ordem da LE (último item = mais recente).
  const withIdx = posts.map((p,i)=>({p,i}));
  withIdx.sort((a,b)=>{
    if (a.p.date && b.p.date){ const k=(b.p.date+(b.p.time||"")).localeCompare(a.p.date+(a.p.time||"")); if (k) return k; }
    return b.i - a.i;
  });
  return withIdx.map(x=>x.p);
}
function phHTML(p, idx, big){
  const cls = p.kind==="reels" ? "ph reel" : p.kind==="dump" ? "ph dump" : "ph";
  const txt = big ? p.slides[idx] : p.title;
  const k = big ? (p.kind==="reels" ? "Vídeo do reels · prévia sem arquivo" : p.kind==="dump" ? "Foto do dump · prévia sem arquivo" : "Lâmina "+(idx+1)+" · prévia sem arte") : p.label;
  return '<div class="'+cls+'"><div class="t">'+esc(txt)+'</div><div class="k">'+esc(k)+'</div></div>';
}
function mediaHTML(m){
  if (m.type==="video") return '<video src="'+esc(m.src)+'" '+(m.poster?'poster="'+esc(m.poster)+'" ':'')+'playsinline controls preload="metadata"></video>';
  return '<img src="'+esc(m.src)+'" alt="" loading="lazy">';
}
function tileHTML(p){
  let inner;
  if (p.media.length){
    const m = p.media[0];
    inner = m.type==="video" ? '<img src="'+esc(m.poster||"")+'" alt="">' : mediaHTML(m);
  } else inner = phHTML(p,0,false);
  const ico = p.kind==="reels" ? I.reel : (p.media.length>1 || (!p.media.length && p.slides.length>1)) ? I.car : "";
  const d = fmtDate(p);
  return '<button class="tile" data-id="'+p.id+'">'+inner+(ico?'<span class="ico">'+ico+'</span>':'')+(d?'<span class="dt">'+d+'</span>':'')+'</button>';
}

function render(){
  const app = document.getElementById("app");
  const mdata = DATA.months[String(month)];
  const st = monthState(month);
  let chips = "";
  for (let m=1;m<=12;m++){
    const s = monthState(m);
    chips += '<button class="chip'+(m===month?" on":"")+(s==="open"?" has":"")+(s==="future"?" lock":"")+'" data-m="'+m+'">'+MES_N[m-1].slice(0,3).toUpperCase()+'</button>';
  }
  let posts = mdata ? mdata.posts : [];
  const totalPosts = Object.values(DATA.months).reduce((a,x)=>a+x.posts.length,0);
  let body = "";
  if (st==="open"){
    // feed acumulado: mês escolhido + meses anteriores abaixo
    let list = [];
    for (let m=month; m>=1; m--){ const md = DATA.months[String(m)]; if (md) list = list.concat(feedOrder(md.posts)); }
    if (tab==="reels") list = list.filter(p=>p.kind==="reels");
    const stories = mdata.stories || [];
    const hl = stories.length
      ? stories.map(s=>'<button class="s" data-story="'+s.id+'"><div class="ring"><div>'+esc(s.day)+'</div></div><div>'+esc(s.label||"")+'</div></button>').join("")
      : '<div class="empty">Sem stories planejados em '+MES_N[month-1].toLowerCase()+'.</div>';
    body = (mdata.note?'<div class="note">'+esc(mdata.note)+'</div>':'')+
      '<div class="hl">'+hl+'</div>'+
      '<div class="tabs"><button data-tab="posts" class="'+(tab==="posts"?"on":"")+'" aria-label="Posts">'+I.grid+'</button><button data-tab="reels" class="'+(tab==="reels"?"on":"")+'" aria-label="Reels">'+I.reels+'</button></div>'+
      '<div class="grid">'+list.map(tileHTML).join("")+'</div>';
  } else if (st==="future"){
    const prev = MES_N[(month+10)%12].toLowerCase();
    body = '<div class="locked">'+I.lock+'<h3>'+MES_N[month-1]+' ainda não foi liberado</h3><p>O planejamento deste mês é enviado no dia 20 de '+prev+'.</p></div>';
  } else {
    body = '<div class="locked">'+I.lock+'<h3>Sem prévia para '+MES_N[month-1].toLowerCase()+'</h3><p>Este mês não tem planejamento nesta visualização.</p></div>';
  }
  app.innerHTML =
    '<div class="months"><div class="yr"><span>Planejamento '+DATA.year+'</span><span>Toque no mês</span></div><div class="chips">'+chips+'</div></div>'+
    '<div class="bar"><h1>'+esc(P.handle)+'</h1></div>'+
    '<div class="prof"><div class="avatar"><div>'+esc(P.initial)+'</div></div><div class="stats"><div><b>'+totalPosts+'</b><span>posts</span></div><div><b>—</b><span>seguidores</span></div><div><b>—</b><span>seguindo</span></div></div></div>'+
    '<div class="bio"><b>'+esc(P.name)+'</b>'+esc(P.bio)+'</div>'+ body +
    '<div class="foot">Prévia de planejamento · as publicações ainda não estão no ar</div>';
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{month=+b.dataset.m; tab="posts"; try{history.replaceState(null,"","#"+MES[month-1])}catch(e){location.hash=MES[month-1]} render(); window.scrollTo(0,0);});
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab; render();});
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>openPost(b.dataset.id));
  const on = app.querySelector(".chip.on"); if (on) on.scrollIntoView({inline:"center",block:"nearest"});
}

function findPost(id){ for (const k in DATA.months){ const p = DATA.months[k].posts.find(x=>x.id===id); if (p) return p; } }
function openPost(id){
  const p = findPost(id); if (!p) return;
  const items = p.media.length ? p.media.map(m=>({m})) : p.slides.map((s,i)=>({i}));
  const vertical = p.kind==="reels";
  const slides = items.map(it=>'<div class="slide">'+(it.m?mediaHTML(it.m):phHTML(p,it.i,true))+'</div>').join("");
  const n = items.length;
  const d = fmtDate(p);
  const when = d ? 'Publicação: '+d+(p.time?' às '+p.time:'') : 'Data e horário: não informados na LE';
  const missing = !p.media.length;
  const el = document.getElementById("post");
  el.innerHTML =
    '<div class="ph-head"><div class="mini">'+esc(P.initial)+'</div><div class="who">'+esc(P.handle)+'<small>'+esc(p.label)+' · '+esc(p.title)+'</small></div><button class="x" id="cl" aria-label="Fechar">'+I.x+'</button></div>'+
    '<div class="stage'+(vertical?" v":"")+'"><div class="track" id="tr">'+slides+'</div>'+
      (n>1?'<button class="nav l" id="pv" aria-label="Anterior">'+I.l+'</button><button class="nav r" id="nx" aria-label="Próxima">'+I.r+'</button><div class="count" id="ct">1/'+n+'</div>':'')+
    '</div>'+
    (n>1?'<div class="dots" id="dt">'+items.map((_,i)=>'<i class="'+(i?"":"on")+'"></i>').join("")+'</div>':'')+
    '<div class="acts">'+I.heart+I.com+I.send+'</div>'+
    '<div class="meta"><span class="tag">'+esc(KIND[p.kind]||p.kind)+(p.kind!=="reels"?' · '+n+(p.kind==="dump"?' fotos':' lâminas'):'')+'</span><span class="tag'+(d?'':' warn')+'">'+esc(when)+'</span>'+(missing?'<span class="tag warn">Arte ainda não carregada</span>':'')+'</div>'+
    '<div class="cap"><b>'+esc(P.handle)+'</b>'+esc(p.caption)+'</div>';
  let k=0;
  const go = j=>{ k=Math.max(0,Math.min(n-1,j)); document.getElementById("tr").style.transform="translateX("+(-100*k)+"%)";
    const ct=document.getElementById("ct"); if(ct) ct.textContent=(k+1)+"/"+n;
    const dt=document.getElementById("dt"); if(dt) [...dt.children].forEach((x,i)=>x.className=i===k?"on":"");
    el.querySelectorAll("video").forEach((v,i)=>{ if(i!==k) try{v.pause()}catch(e){} }); };
  if (n>1){ document.getElementById("pv").onclick=()=>go(k-1); document.getElementById("nx").onclick=()=>go(k+1);
    let sx=null; const tr=document.getElementById("tr");
    tr.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
    tr.addEventListener("touchend",e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) go(k+(dx<0?1:-1)); sx=null; }); }
  document.getElementById("cl").onclick=closePost;
  document.getElementById("ov").classList.add("open");
}
function closePost(){ const ov=document.getElementById("ov"); ov.classList.remove("open"); ov.querySelectorAll("video").forEach(v=>{try{v.pause()}catch(e){}}); }
document.getElementById("ov").addEventListener("click",e=>{ if(e.target.id==="ov") closePost(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closePost(); });

function fromHash(){
  const h = (location.hash||"").replace("#","");
  const i = MES.indexOf(h);
  if (i>=0) return i+1;
  // padrão: mês mais recente com conteúdo
  const ks = Object.keys(DATA.months).map(Number).sort((a,b)=>b-a);
  return ks.length ? ks[0] : today.getMonth()+1;
}
month = fromHash();
window.addEventListener("hashchange",()=>{ month=fromHash(); render(); });
render();
</script>
